modLoader="javafml"
loaderVersion="[${forge_min_version},)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mixins]]
config="${mod_id}.mixins.json"

# Forge 专用：粒子本地工厂劫持（ParticleEngineMixin）只在 forge 侧存在，
# 其类位于 loaders/forge 包、由独立的 footprintparticle-forge.mixins.json 声明，
# 不并入共享 mixins.json，避免 Fabric/NeoForge 因找不到该类而加载失败。
[[mixins]]
config="${mod_id}-forge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="${mod_icon}"
credits="${mod_contributor}"
authors="${mod_author}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${cloth_id}"
mandatory=true
versionRange="[1.0,)"
ordering="AFTER"
side="CLIENT"
