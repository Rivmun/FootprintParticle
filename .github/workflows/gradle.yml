# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  # 无混淆的 26.x：走 Forgix mergeJars 全链路检查（自动构建该版本所有 loader 子工程并合并）
  merged:
    strategy:
      matrix:
        mc: ["26.1"]
        java: [25]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: merge build (forgix)
        run: ./gradlew mergeJars -Pforgix.mc=${{ matrix.mc }} --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-${{ matrix.mc }}
          path: build/merged/*.jar

  # 1.21.11 及更早版本仍混淆，不参与 Forgix 合并：分别构建每个 loader 子工程做编译检查
  per-loader:
    strategy:
      matrix:
        version: [
          "1.21.11-fabric", "1.21.11-neoforge",
          "1.21.1-fabric", "1.21.1-neoforge",
          "1.20.1-fabric", "1.20.1-forge",
          "1.19.2-fabric", "1.19.2-forge",
          "1.18.2-fabric", "1.18.2-forge",
          "1.16.5-fabric", "1.16.5-forge"
        ]
        java: [25]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.version }}
        run: ./gradlew ${{ matrix.version }}:build --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
